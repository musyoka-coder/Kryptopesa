<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KryptoPesa Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <meta name="theme-color" content="#07152f" />
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy-950: #050d1d; --navy-900: #07152f; --navy-800: #0b2045; --navy-700: #12366d;
      --blue: #1769ff; --blue-soft: #eef4ff; --gold: #ffd21f; --gold-dark: #b38f00;
      --bg: #f4f6fb; --surface: #ffffff; --text: #0b1830; --text-soft: #56657f; --border: #e3e9f2;
      --green: #12875a; --green-soft: #e4f6ee; --red: #c93232; --red-soft: #fdecec;
      --amber: #9a6a00; --amber-soft: #fff4d6; --gray-soft: #eef1f6;
      --shadow: 0 8px 28px rgba(11, 24, 48, 0.07); --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Never let display:grid/flex override the browser hidden attribute. */
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body { font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--blue); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    /* Keyboard-only skip link; frame-ancestors and X-Frame-Options must be set
       by the host, because they are ignored inside a meta CSP. */
    .skip-link { position: fixed; left: 12px; top: -80px; z-index: 9999; display: inline-flex; align-items: center; min-height: 44px; padding: 10px 16px; border-radius: 10px; background: #07152f; color: #fff; font-weight: 700; font-size: .86rem; text-decoration: none; transition: top .15s ease; }
    .skip-link:focus-visible { top: 12px; outline: 3px solid #ffd21f; outline-offset: 2px; }
    :focus-visible { outline: 3px solid rgba(23, 105, 255, 0.55); outline-offset: 2px; }

    /* ===== layout ===== */
    .shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 22px 16px; background: linear-gradient(180deg, var(--navy-950), var(--navy-900)); color: #fff; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; text-decoration: none; color: #fff; }
    .brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
    .brand strong { font-family: "Manrope", sans-serif; font-size: 1.05rem; letter-spacing: -0.02em; }
    .brand strong span { color: var(--gold); }
    .brand small { display: block; color: rgba(255,255,255,.6); font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav button { display: flex; align-items: center; gap: 11px; width: 100%; min-height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: rgba(255,255,255,.78); font-weight: 600; font-size: .92rem; text-align: left; cursor: pointer; transition: background .15s, color .15s; }
    .nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
    .nav button[aria-current="page"] { background: var(--gold); color: var(--navy-950); }
    .nav .ico { width: 20px; text-align: center; font-size: 1rem; }
    .nav .count { margin-left: auto; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--red); color: #fff; font-size: .72rem; font-weight: 700; text-align: center; }
    .nav button[aria-current="page"] .count { background: var(--navy-950); }
    .side-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.1); font-size: .8rem; color: rgba(255,255,255,.7); }
    .side-foot strong { display: block; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-foot .row { display: flex; gap: 8px; margin-top: 10px; }

    .main { padding: 28px clamp(16px, 3vw, 40px) 60px; min-width: 0; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .page-head h1 { font-family: "Manrope", sans-serif; font-size: clamp(1.5rem, 2.4vw, 2rem); letter-spacing: -0.03em; }
    .page-head p { color: var(--text-soft); font-size: .9rem; }
    .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* ===== controls ===== */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); font-weight: 700; font-size: .86rem; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
    .btn:hover { background: var(--gray-soft); }
    .btn.primary { background: var(--navy-900); color: #fff; border-color: var(--navy-900); }
    .btn.primary:hover { background: var(--navy-700); }
    .btn.danger { background: var(--red); color: #fff; border-color: var(--red); }
    .btn.danger:hover { background: #a82727; }
    .btn.ok { background: var(--green); color: #fff; border-color: var(--green); }
    .btn.ok:hover { background: #0e6d49; }
    .btn.small { min-height: 32px; padding: 0 11px; font-size: .78rem; border-radius: 9px; }
    /* High-contrast sign-out controls on the dark admin sidebar. */
    #signOut, #signOutMobile { background: #ffd21f; color: #07152f; border-color: #ffd21f; font-weight: 800; }
    #signOut:hover, #signOutMobile:hover { background: #ffe16a; color: #07152f; border-color: #ffe16a; }
    #signOut:focus-visible, #signOutMobile:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .btn[disabled] { opacity: .55; cursor: not-allowed; }
    .field { display: grid; gap: 5px; }
    .field label { font-size: .76rem; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: .05em; }
    input[type="text"], input[type="search"], input[type="number"], select, textarea {
      min-height: 40px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 11px; background: #fff; width: 100%; }
    textarea { min-height: 90px; resize: vertical; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
    .filters .field { min-width: 150px; }
    .filters .field.grow { flex: 1 1 240px; }

    /* ===== cards ===== */
    .grid-kpi { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .kpi { padding: 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .kpi .label { color: var(--text-soft); font-size: .76rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .kpi .value { margin-top: 6px; font-family: "Manrope", sans-serif; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; }
    .kpi .sub { color: var(--text-soft); font-size: .8rem; }
    .kpi.warn .value { color: var(--red); }
    .kpi.good .value { color: var(--green); }
    .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); gap: 16px; margin-bottom: 18px; }
    .card { padding: 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
    .card h2 { font-family: "Manrope", sans-serif; font-size: 1rem; letter-spacing: -0.02em; margin-bottom: 4px; }
    .card .hint { color: var(--text-soft); font-size: .8rem; margin-bottom: 12px; }
    .chart svg { width: 100%; height: auto; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: .8rem; color: var(--text-soft); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .donut-wrap svg { width: 150px; flex: 0 0 150px; }
    .donut-wrap .legend { flex-direction: column; margin: 0; gap: 7px; }
    .empty { padding: 34px 12px; text-align: center; color: var(--text-soft); font-size: .9rem; }
    .attn { list-style: none; display: grid; gap: 8px; }
    .attn li button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; cursor: pointer; text-align: left; font-weight: 600; }
    .attn li button:hover { background: var(--gray-soft); }
    .pill-n { min-width: 28px; padding: 2px 9px; border-radius: 999px; background: var(--gray-soft); font-weight: 800; font-size: .8rem; text-align: center; }
    .pill-n.bad { background: var(--red-soft); color: var(--red); }
    .pill-n.good { background: var(--green-soft); color: var(--green); }

    /* ===== tables ===== */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    th { position: sticky; top: 0; padding: 12px 14px; background: #f8fafd; color: var(--text-soft); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafbfe; }
    tr.row-failed td:first-child { box-shadow: inset 3px 0 0 var(--red); }
    td .sub { display: block; color: var(--text-soft); font-size: .76rem; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .78rem; word-break: break-all; }
    .linkbtn { padding: 0; border: 0; background: none; color: var(--blue); font-weight: 700; cursor: pointer; text-align: left; }
    .linkbtn:hover { text-decoration: underline; }
    .detail-row td { background: #f8fafd; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 24px; }
    .detail-grid dt { color: var(--text-soft); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .detail-grid dd { word-break: break-word; }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 4px 0; color: var(--text-soft); font-size: .84rem; }
    .pager .btns { display: flex; gap: 8px; }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; background: var(--gray-soft); color: var(--text-soft); font-size: .74rem; font-weight: 700; white-space: nowrap; }
    .badge.green { background: var(--green-soft); color: var(--green); }
    .badge.red { background: var(--red-soft); color: var(--red); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); }
    .badge.blue { background: var(--blue-soft); color: var(--blue); }

    /* ===== dialogs ===== */
    dialog { border: 0; padding: 0; color: var(--text); }
    dialog::backdrop { background: rgba(5, 13, 29, .55); backdrop-filter: blur(2px); }
    dialog.modal { width: min(94vw, 460px); border-radius: 18px; background: #fff; box-shadow: 0 30px 80px rgba(5,13,29,.35); margin: auto; }
    .modal-form { display: grid; gap: 14px; padding: 24px; }
    .modal-form h2 { font-family: "Manrope", sans-serif; font-size: 1.15rem; }
    .modal-form p.intro { color: var(--text-soft); font-size: .88rem; }
    .form-error { color: var(--red); font-size: .84rem; font-weight: 600; min-height: 1.2em; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .check { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .check input { width: 20px; height: 20px; }
    dialog.drawer { width: min(100vw, 760px); height: 100vh; max-height: 100vh; margin: 0 0 0 auto; background: var(--bg); box-shadow: -20px 0 60px rgba(5,13,29,.3); }
    .drawer-inner { display: flex; flex-direction: column; height: 100%; }
    .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 24px 16px; background: #fff; border-bottom: 1px solid var(--border); }
    .drawer-head h2 { font-family: "Manrope", sans-serif; font-size: 1.25rem; letter-spacing: -0.02em; word-break: break-word; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px 40px; display: grid; gap: 16px; align-content: start; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tabs button { min-height: 34px; padding: 0 13px; border: 1px solid var(--border); border-radius: 999px; background: #fff; font-weight: 700; font-size: .78rem; cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--navy-900); border-color: var(--navy-900); color: #fff; }

    /* ===== states ===== */
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; background: linear-gradient(135deg, var(--navy-950), var(--navy-900)); color: #fff; }
    .gate .box { max-width: 440px; }
    .gate h1 { font-family: "Manrope", sans-serif; font-size: 1.6rem; margin-bottom: 8px; }
    .gate p { color: rgba(255,255,255,.75); margin-bottom: 20px; }
    .spinner { width: 34px; height: 34px; margin: 0 auto 14px; border: 4px solid rgba(255,255,255,.25); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
    .loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 0; color: var(--text-soft); }
    .loading .spinner { margin: 0; border-color: var(--border); border-top-color: var(--blue); width: 26px; height: 26px; border-width: 3px; }
    .errorbox { padding: 24px; border: 1px solid #f3c2c2; border-radius: var(--radius); background: var(--red-soft); color: var(--red); display: grid; gap: 12px; justify-items: start; }
    .toasts { position: fixed; right: 16px; bottom: 16px; z-index: 5000; display: grid; gap: 8px; }
    .toast { padding: 12px 16px; border-radius: 12px; background: var(--navy-900); color: #fff; font-weight: 600; font-size: .88rem; box-shadow: 0 12px 30px rgba(0,0,0,.25); max-width: 340px; }
    .toast.err { background: var(--red); }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: sticky; z-index: 50; height: auto; flex-direction: row; align-items: center; gap: 10px; padding: 10px 12px; overflow-x: auto; }
      .brand { padding: 0 6px 0 0; } .brand small, .side-foot { display: none; }
      .nav { flex-direction: row; } .nav button { white-space: nowrap; min-height: 40px; padding: 0 12px; }
      .nav .count { margin-left: 4px; }
      .sidebar .mobile-out { display: inline-flex; margin-left: auto; }
    }
    @media (min-width: 901px) { .sidebar .mobile-out { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>

  <a class="skip-link" href="#main">Skip to dashboard content</a>

  <div id="gate" class="gate" role="status">
    <div class="box"><div class="spinner" aria-hidden="true"></div><p>Checking your access…</p></div>
  </div>

  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="KryptoPesa home">
        <img src="logo.jpg" alt="" width="38" height="38" />
        <div><strong>Krypto<span>Pesa</span></strong><small>Admin</small></div>
      </a>
      <nav class="nav" id="nav" aria-label="Admin sections"></nav>
      <button class="btn small mobile-out" id="signOutMobile" type="button">Sign out</button>
      <div class="side-foot">
        <strong id="meName">Admin</strong>
        <span id="meEmail"></span>
        <div class="row">
          <button class="btn small" id="signOut" type="button">Sign out</button>
        </div>
      </div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
  <script src="supabase-client.js"></script>
  <script src="session-management.js"></script>
  <script src="assets/pages/admin-1.js"></script>
</body>
</html>
