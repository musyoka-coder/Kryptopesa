<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>KryptoPesa | Identity Verification</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><style>body{font:16px system-ui;background:#07152f;color:white;margin:0;min-height:100vh;display:grid;place-items:center}main{background:#10234a;padding:32px;max-width:460px;width:calc(100% - 56px);border-radius:16px}h1{margin-top:0}button{background:#ffd21f;border:0;border-radius:8px;padding:14px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}p{line-height:1.6}a{color:#ffd21f}</style></head><body><main><h1>Identity verification</h1><p>Complete secure identity checks with Didit. This environment is for sandbox testing only. No wallet or financial access will be enabled.</p><p id="status" role="status">Checking your account…</p><button id="start" disabled>Start sandbox verification</button><p><a href="homepage.html">Back to account</a></p></main><script>
(async()=>{const sb=typeof supabaseClient!=="undefined"?supabaseClient:null;const status=document.getElementById("status"),button=document.getElementById("start");if(!sb){status.textContent="Authentication unavailable.";return;}const {data:{session},error}=await sb.auth.getSession();if(error||!session){location.replace("login.html");return;}const {data:cases,error:caseError}=await sb.from("kyc_verification_cases").select("status,created_at").order("created_at",{ascending:false}).limit(1);if(caseError){status.textContent="Unable to load verification status.";return;}if(cases?.length&&["pending","in_review","verified"].includes(cases[0].status)){status.textContent="Your current verification status: "+cases[0].status.replace("_"," ")+". Contact support if you need another verification.";return;}status.textContent="Sandbox verification is available when the provider is configured.";button.disabled=false;button.addEventListener("click",async()=>{button.disabled=true;status.textContent="Creating secure verification session…";try{const {data,error}=await sb.functions.invoke("didit-sandbox-session",{body:{}});if(error||!data?.url){let detail=data?.error||data?.message||"";if(error?.context){try{const body=await error.context.clone().json();detail=body?.error||body?.message||detail;}catch{}}throw Error(detail||"Sandbox session unavailable. Check provider configuration.");}const u=new URL(data.url);if(u.protocol!=="https:"||u.hostname!=="verify.didit.me")throw Error("Invalid provider URL.");location.assign(u.toString());}catch(e){status.textContent=e.message||"Unable to start verification.";button.disabled=false;}})})();
</script></body></html>
