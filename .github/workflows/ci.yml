name: Verify KryptoPesa
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix web
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm test --prefix web
      - run: npm run build:all
        env:
          PUBLIC_SUPABASE_URL: https://fixture.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_fixture
      - run: go vet ./api ./cmd/... ./pkg/...
      - run: go test -race -coverprofile=coverage.out ./api ./cmd/... ./pkg/...
      - run: node scripts/check-go-coverage.cjs coverage.out
      - run: go build ./api ./cmd/... ./pkg/...
      - run: test -z "$(gofmt -l api cmd pkg)"

  local-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Verify isolated account flow
        run: |
          curl --retry 15 --retry-all-errors --retry-delay 2 -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/next/ > /dev/null
          test "$(curl -s -o /tmp/anonymous.json -w '%{http_code}' http://127.0.0.1:8080/api/account)" = 401
          curl --retry 15 --retry-all-errors --retry-delay 2 -fsS -H 'Authorization: Bearer local-test-token' http://127.0.0.1:8080/api/account | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p == {"username":"Local fixture","account_status":"active","kyc_status":"pending"}'
      - if: always()
        run: docker compose logs && docker compose down
