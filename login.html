<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <title>KryptoPesa — Log In</title>
  <meta name="theme-color" content="#0B1020" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="assets/kp-tokens.css" />
  <link rel="stylesheet" href="assets/auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
          integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="session-management.js"></script>
</head>
<body class="auth">
  <a class="kp-skip" href="#main">Skip to sign-in form</a>

  <header class="auth__top">
    <a class="auth__brand" href="index.html" aria-label="KryptoPesa home">
      <img src="assets/logo-96.png" width="40" height="40" alt="" class="auth__logo" />
    </a>
    <a class="auth__brand" href="index.html">KryptoPesa</a>
  </header>

  <main class="auth__main" id="main">
    <section class="auth__card" aria-labelledby="loginTitle">
      <h1 class="auth__title" id="loginTitle">Welcome back</h1>
      <p class="auth__subtitle">Log in to your KryptoPesa account</p>

      <div class="auth__msg auth__msg--error" id="errorMsg" tabindex="-1" role="alert" aria-live="assertive"></div>

      <form id="loginForm" novalidate>
        <div class="auth__group">
          <label class="kp-label" for="loginEmail">Email address</label>
          <input class="kp-input" type="email" id="loginEmail" name="email"
                 placeholder="you@example.com" autocomplete="username" inputmode="email"
                 aria-describedby="emailHelp" required />
          <p class="auth__hint" id="emailHelp">Use the address you signed up with.</p>
        </div>

        <div class="auth__group">
          <label class="kp-label" for="loginPassword">Password</label>
          <div class="auth__field">
            <input class="kp-input" type="password" id="loginPassword" name="password"
                   placeholder="Enter your password" autocomplete="current-password" required />
            <button class="auth__reveal" type="button" data-target="loginPassword" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth__submit" id="loginBtn">Log in</button>
      </form>

      <div class="auth__links">
        <a href="forgot_password.html">Forgot your password?</a>
        <span>New to KryptoPesa? <a href="signup.html">Create an account</a></span>
      </div>
    </section>
  </main>

  <footer class="auth__foot">© 2026 KryptoPesa. All rights reserved.</footer>

  <script src="assets/pages/login-1.js"></script>
</body>
</html>
