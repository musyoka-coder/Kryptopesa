<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="light"/>
  <meta name="theme-color" content="#0d1b4c"/>
  <title>KryptoPesa — Create New Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <style>
    :root{
      --navy-deep: #0d1b4c;
      --navy: #10237a;
      --navy-bright: #1445c9;
      --gold: #ffc93c;
      --gold-dim: #f2b705;
      --ink: #1e2333;
      --muted: #6b7280;
      --line: #e6e8f0;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-line: #fecaca;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-line: #bbf7d0;
      --radius: 14px;
    }

    *{margin:0;padding:0;box-sizing:border-box;}

    @media (prefers-reduced-motion: reduce){
      *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
    }

    body{
      font-family:'Inter','Segoe UI',system-ui,sans-serif;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(255,201,60,.16), transparent 60%),
        linear-gradient(150deg, var(--navy-deep) 0%, var(--navy) 55%, var(--navy-bright) 100%);
      background-attachment:fixed;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      color:var(--ink);
    }

    .top-bar{
      padding:22px 28px;
      display:flex;
      align-items:center;
      gap:11px;
    }
    .logo-icon{
      width:38px;height:38px;
      background:linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      font-size:17px;font-weight:900;color:var(--navy-deep);
      box-shadow:0 4px 14px rgba(0,0,0,.25);
    }
    .brand{color:#fff;font-weight:700;font-size:1.15rem;letter-spacing:.2px;}

    .center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;}

    .container{
      background:#fff;
      max-width:420px;
      width:100%;
      padding:38px 34px;
      border-radius:var(--radius);
      box-shadow:0 30px 70px rgba(6,10,40,.35);
      border:1px solid rgba(255,255,255,.5);
    }

    .lock-badge{
      width:46px;height:46px;
      border-radius:50%;
      background:linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 16px;
      box-shadow:0 6px 16px rgba(255,201,60,.35);
    }
    .lock-badge svg{width:20px;height:20px;stroke:var(--navy-deep);}

    h2{text-align:center;color:var(--navy-deep);margin-bottom:6px;font-size:1.55rem;font-weight:800;letter-spacing:-.2px;}
    .subtitle{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:24px;line-height:1.4;}

    .form-group{margin-bottom:18px;}
    label{display:block;margin-bottom:6px;font-weight:600;font-size:12px;color:#374151;text-transform:uppercase;letter-spacing:.5px;}

    .field-wrap{position:relative;}
    input{
      width:100%;
      padding:12px 42px 12px 14px;
      border:1.5px solid var(--line);
      border-radius:9px;
      font-size:15px;
      font-family:inherit;
      transition:border-color .15s, box-shadow .15s;
      background:#fbfbfd;
    }
    input:focus{
      outline:none;
      border-color:var(--navy-bright);
      box-shadow:0 0 0 3px rgba(20,69,201,.12);
      background:#fff;
    }
    input:focus-visible{outline:2px solid var(--navy-bright);outline-offset:2px;}

    .toggle-visibility{
      position:absolute;
      right:6px;top:50%;
      transform:translateY(-50%);
      width:32px;height:32px;
      display:flex;align-items:center;justify-content:center;
      background:none;border:none;cursor:pointer;
      color:var(--muted);
      border-radius:6px;
    }
    .toggle-visibility:hover{color:var(--navy-bright);background:rgba(20,69,201,.06);}
    .toggle-visibility:focus-visible{outline:2px solid var(--navy-bright);outline-offset:2px;}
    .toggle-visibility svg{width:18px;height:18px;}

    .error-msg, .success-msg{
      padding:11px 14px;
      border-radius:9px;
      font-size:13.5px;
      margin-bottom:16px;
      display:none;
      line-height:1.4;
    }
    .error-msg{background:var(--danger-bg);border:1px solid var(--danger-line);color:var(--danger);}
    .success-msg{background:var(--success-bg);border:1px solid var(--success-line);color:var(--success);}

    .btn{
      width:100%;
      padding:13px;
      background:var(--navy-deep);
      color:#fff;
      border:none;
      border-radius:9px;
      font-weight:700;
      font-size:15px;
      cursor:pointer;
      transition:background .15s, box-shadow .15s;
      font-family:inherit;
    }
    .btn:hover:not(:disabled){background:var(--navy-bright);box-shadow:0 8px 20px rgba(20,69,201,.3);}
    .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
    .btn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none;}

    .link-row{text-align:center;margin-top:18px;font-size:.88rem;color:var(--muted);}
    .link-row a{color:var(--navy-bright);font-weight:700;text-decoration:none;}
    .link-row a:hover{text-decoration:underline;}
    .link-row a:focus-visible{outline:2px solid var(--navy-bright);outline-offset:2px;border-radius:3px;}

    footer{text-align:center;padding:18px;color:rgba(255,255,255,.6);font-size:.78rem;}

    .info-box{
      background:#fff8e6;
      border:1px solid #fce8a8;
      border-radius:9px;
      padding:13px 14px;
      margin-bottom:18px;
      font-size:13.5px;
      color:#8a6403;
      line-height:1.4;
    }

    .strength-bar{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden;}
    .strength-fill{height:100%;border-radius:2px;transition:width .25s ease, background .25s ease;width:0;}
    .strength-label{font-size:11px;margin-top:5px;font-weight:600;min-height:14px;}

    .user-display{
      text-align:center;
      font-weight:600;
      color:var(--navy-deep);
      margin-bottom:14px;
      font-size:.92rem;
      word-break:break-all;
    }

    .spinner{
      display:inline-block;width:14px;height:14px;
      border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .7s linear infinite;
      vertical-align:-2px;
      margin-right:7px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    @media (max-width:480px){
      .container{padding:30px 22px;}
      .top-bar{padding:18px 20px;}
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <img src="logo.jpg" alt="KryptoPesa logo" class="logo-icon" onerror="this.style.display='none'">
    <span class="brand">KryptoPesa</span>
  </div>

  <div class="center">
    <main class="container">
      <div class="lock-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
      </div>

      <h2>Create New Password</h2>
      <p class="subtitle">Set a new password to secure your account</p>

      <div class="error-msg" id="errorMsg" role="alert"></div>
      <div class="success-msg" id="successMsg" role="status"></div>
      <div class="info-box" id="infoBox" role="status">Verifying your reset link…</div>
      <div class="user-display" id="userDisplay"></div>

      <form id="resetForm" style="display:none;" novalidate>
        <div class="form-group">
          <label for="newPassword">New password</label>
          <div class="field-wrap">
            <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password" oninput="checkStrength(this.value)" />
            <button type="button" class="toggle-visibility" data-target="newPassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel"></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>
          <div class="field-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" minlength="6" required autocomplete="new-password" />
            <button type="button" class="toggle-visibility" data-target="confirmPassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn" id="resetBtn">Set new password</button>
      </form>

      <div class="link-row">
        <a href="https://www.kryptopesa.app/login.html">Back to login</a>
      </div>
    </main>
  </div>

  <footer>© 2025 KryptoPesa. All rights reserved.</footer>

  <script>
    // Show/hide password toggles
    document.querySelectorAll('.toggle-visibility').forEach(function(btn){
      btn.addEventListener('click', function(){
        var input = document.getElementById(btn.dataset.target);
        var isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });

    function checkStrength(pw) {
      var fill = document.getElementById('strengthFill');
      var label = document.getElementById('strengthLabel');

      if (!pw) {
        fill.style.width = '0%';
        fill.style.background = 'transparent';
        label.textContent = '';
        return;
      }

      var score = 0;
      if (pw.length >= 6) score++;
      if (pw.length >= 10) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;

      var levels = [
        {pct:'20%',  color:'#dc2626', text:'Very weak'},
        {pct:'40%',  color:'#ea580c', text:'Weak'},
        {pct:'60%',  color:'#d97706', text:'Fair'},
        {pct:'80%',  color:'#65a30d', text:'Strong'},
        {pct:'100%', color:'#059669', text:'Very strong'}
      ];
      // Clamp so any score (including 0, i.e. under 6 chars) maps to a valid level.
      var lvl = levels[Math.min(Math.max(score - 1, 0), levels.length - 1)];

      fill.style.width = lvl.pct;
      fill.style.background = lvl.color;
      label.textContent = lvl.text;
      label.style.color = lvl.color;
    }

    function showError(msg) {
      var el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
    }
    function showSuccess(msg) {
      var el = document.getElementById('successMsg');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('errorMsg').style.display = 'none';
    }

    var recoverySession = null;

    // Supabase's reset-link click lands here with a recovery token in the URL.
    // supabase-js parses that automatically on load and fires PASSWORD_RECOVERY.
    supabaseClient.auth.onAuthStateChange(function(event, session){
      if (event === 'PASSWORD_RECOVERY') {
        recoverySession = session;
        showResetForm(session);
      }
    });

    // Fallback in case the event already fired before this listener attached
    supabaseClient.auth.getSession().then(function(result){
      var session = result.data.session;
      if (session && !recoverySession) {
        recoverySession = session;
        showResetForm(session);
      } else if (!session) {
        document.getElementById('infoBox').textContent =
          'This reset link is invalid or has expired. Redirecting…';
        setTimeout(function(){ window.location.href = 'https://www.kryptopesa.app/forgot_password.html'; }, 2500);
      }
    }).catch(function(){
      document.getElementById('infoBox').textContent =
        'We couldn\u2019t verify your reset link. Redirecting…';
      setTimeout(function(){ window.location.href = 'https://www.kryptopesa.app/forgot_password.html'; }, 2500);
    });

    function showResetForm(session) {
      document.getElementById('infoBox').textContent =
        'Choose a new password below to finish resetting your account.';
      // textContent is used (not innerHTML), so the email is inserted safely.
      document.getElementById('userDisplay').textContent = 'Resetting password for ' + session.user.email;
      document.getElementById('resetForm').style.display = 'block';
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';

      var newPassword = document.getElementById('newPassword').value;
      var confirmPassword = document.getElementById('confirmPassword').value;
      var btn = document.getElementById('resetBtn');

      if (newPassword.length < 6) { showError('Password must be at least 6 characters.'); return; }
      if (newPassword !== confirmPassword) { showError('Passwords do not match.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Setting password…';

      try {
        var updateResult = await supabaseClient.auth.updateUser({ password: newPassword });
        var error = updateResult.error;

        if (error) {
          showError(error.message);
          btn.disabled = false;
          btn.textContent = 'Set new password';
          return;
        }

        if (recoverySession && recoverySession.user && recoverySession.user.id) {
          // Best-effort activity log — a failure here shouldn't block the reset flow.
          try {
            await supabaseClient.from('activity_log').insert({
              user_id: recoverySession.user.id,
              event: 'Password Reset Completed',
              status: 'success'
            });
          } catch (logErr) {
            console.warn('Activity log write failed:', logErr);
          }
        }

        showSuccess('Password updated! Redirecting to login…');
        await supabaseClient.auth.signOut();
        setTimeout(function(){ window.location.href = 'https://www.kryptopesa.app/login.html'; }, 1500);
      } catch (err) {
        showError('Something went wrong. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Set new password';
      }
    });
  </script>
</body>
</html>
