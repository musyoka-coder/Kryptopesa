<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <title>KryptoPesa — Create New Password</title>
  <meta name="theme-color" content="#0B1020" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="assets/kp-tokens.css" />
  <link rel="stylesheet" href="assets/auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
          integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="supabase-client.js"></script>
</head>
<body class="auth">
  <a class="kp-skip" href="#main">Skip to new password form</a>

  <header class="auth__top">
    <a class="auth__brand" href="index.html" aria-label="KryptoPesa home">
      <img src="assets/logo-96.png" width="40" height="40" alt="" class="auth__logo" />
    </a>
    <a class="auth__brand" href="index.html">KryptoPesa</a>
  </header>

  <main class="auth__main" id="main">
    <section class="auth__card" aria-labelledby="resetTitle">
      <div class="auth__badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
      </div>

      <h1 class="auth__title" id="resetTitle">Create a new password</h1>
      <p class="auth__subtitle">Set a new password to secure your account.</p>

      <div class="auth__msg auth__msg--error" id="errorMsg" role="alert" aria-live="assertive"></div>
      <div class="auth__msg auth__msg--ok" id="successMsg" role="status" aria-live="polite"></div>
      <div class="auth__msg auth__msg--info" id="infoBox" role="status" data-show="true">Verifying your reset link…</div>
      <p class="auth__user" id="userDisplay"></p>

      <form id="resetForm" hidden novalidate>
        <div class="auth__group">
          <label class="kp-label" for="newPassword">New password</label>
          <div class="auth__field">
            <input class="kp-input" type="password" id="newPassword" name="newPassword"
                   placeholder="At least 6 characters" autocomplete="new-password"
                   minlength="6" aria-describedby="strengthLabel" required />
            <button class="auth__reveal" type="button" data-target="newPassword" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="auth__meter" aria-hidden="true"><i id="strengthFill"></i></div>
          <p class="auth__meter-label" id="strengthLabel" aria-live="polite"></p>
        </div>

        <div class="auth__group">
          <label class="kp-label" for="confirmPassword">Confirm new password</label>
          <div class="auth__field">
            <input class="kp-input" type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="Re-enter your password" autocomplete="new-password"
                   minlength="6" required />
            <button class="auth__reveal" type="button" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth__submit" id="resetBtn">Set new password</button>
      </form>

      <div class="auth__links">
        <a href="login.html">Back to login</a>
      </div>
    </section>
  </main>

  <footer class="auth__foot">© 2026 KryptoPesa. All rights reserved.</footer>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('resetForm');
      var newPassword = document.getElementById('newPassword');
      var confirmPassword = document.getElementById('confirmPassword');
      var btn = document.getElementById('resetBtn');
      var errorBox = document.getElementById('errorMsg');
      var successBox = document.getElementById('successMsg');
      var infoBox = document.getElementById('infoBox');
      var userDisplay = document.getElementById('userDisplay');
      var strengthFill = document.getElementById('strengthFill');
      var strengthLabel = document.getElementById('strengthLabel');
      var recoverySession = null;

      var LEVELS = [
        { pct: '20%', color: '#c02626', text: 'Very weak' },
        { pct: '40%', color: '#c2551b', text: 'Weak' },
        { pct: '60%', color: '#8a5a00', text: 'Fair' },
        { pct: '80%', color: '#3f7d20', text: 'Strong' },
        { pct: '100%', color: '#0e7c5a', text: 'Very strong' }
      ];

      function hideMessages() {
        errorBox.removeAttribute('data-show');
        successBox.removeAttribute('data-show');
      }

      function showError(msg) {
        hideMessages();
        errorBox.textContent = msg;
        errorBox.setAttribute('data-show', 'true');
      }

      function showSuccess(msg) {
        hideMessages();
        successBox.textContent = msg;
        successBox.setAttribute('data-show', 'true');
      }

      function checkStrength(pw) {
        if (!pw) {
          strengthFill.style.width = '0%';
          strengthFill.style.background = 'transparent';
          strengthLabel.textContent = '';
          return;
        }
        var score = 0;
        if (pw.length >= 6) score++;
        if (pw.length >= 10) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;

        var level = LEVELS[Math.min(Math.max(score - 1, 0), LEVELS.length - 1)];
        strengthFill.style.width = level.pct;
        strengthFill.style.background = level.color;
        strengthLabel.textContent = 'Password strength: ' + level.text;
        strengthLabel.style.color = level.color;
      }

      newPassword.addEventListener('input', function () { checkStrength(newPassword.value); });

      document.querySelectorAll('.auth__reveal').forEach(function (toggle) {
        toggle.addEventListener('click', function () {
          var input = document.getElementById(toggle.getAttribute('data-target'));
          if (!input) return;
          var hidden = input.type === 'password';
          input.type = hidden ? 'text' : 'password';
          toggle.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
          toggle.setAttribute('aria-pressed', hidden ? 'true' : 'false');
        });
      });

      function showResetForm(session) {
        infoBox.textContent = 'Choose a new password below to finish resetting your account.';
        /* textContent, never innerHTML: the email is user-controlled data. */
        userDisplay.textContent = 'Resetting password for ' + session.user.email;
        form.hidden = false;
        newPassword.focus();
      }

      /* Supabase parses the recovery token in the URL on load and fires
         PASSWORD_RECOVERY; the getSession() call below is the fallback for
         the case where the event fired before this listener attached. */
      supabaseClient.auth.onAuthStateChange(function (event, session) {
        if (event === 'PASSWORD_RECOVERY' && session) {
          recoverySession = session;
          showResetForm(session);
        }
      });

      supabaseClient.auth.getSession().then(function (result) {
        var session = result && result.data ? result.data.session : null;
        if (session && !recoverySession) {
          recoverySession = session;
          showResetForm(session);
        } else if (!session) {
          infoBox.textContent = 'This reset link is invalid or has expired. Redirecting…';
          setTimeout(function () { window.location.href = 'forgot_password.html'; }, 2500);
        }
      }).catch(function () {
        infoBox.textContent = 'We could not verify your reset link. Redirecting…';
        setTimeout(function () { window.location.href = 'forgot_password.html'; }, 2500);
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        hideMessages();

        var next = newPassword.value;
        var confirm = confirmPassword.value;

        if (next.length < 6) {
          showError('Password must be at least 6 characters.');
          newPassword.focus();
          return;
        }
        if (next !== confirm) {
          showError('Passwords do not match.');
          confirmPassword.focus();
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="auth__spinner" aria-hidden="true"></span>Setting password…';

        var update;
        try {
          update = await supabaseClient.auth.updateUser({ password: next });
        } catch (err) {
          update = { error: err };
        }

        if (update && update.error) {
          showError(update.error.message || 'Something went wrong. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Set new password';
          return;
        }

        /* Best-effort activity log; a failure here must not block the reset. */
        if (recoverySession && recoverySession.user && recoverySession.user.id) {
          try {
            await supabaseClient.from('activity_log').insert({
              user_id: recoverySession.user.id,
              event: 'Password Reset Completed',
              status: 'success'
            });
          } catch (err) { /* non-blocking */ }
        }

        showSuccess('Password updated. Redirecting to login…');
        await supabaseClient.auth.signOut();
        setTimeout(function () { window.location.href = 'login.html'; }, 1500);
      });
    })();
  </script>
</body>
</html>
